<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — KudiWatch</title>
<link rel="stylesheet" href="/css/kw.css">
<meta name="theme-color" content="#0b6e4f">
</head>
<body>
<div class="wrap wide" id="app">
  <h1>Admin console</h1>
  <div id="gate"></div>
  <div id="main" hidden>
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:16px" role="tablist" aria-label="Admin sections">
      <button class="btn secondary sm" data-tab="payouts" role="tab">Payout queue</button>
      <button class="btn secondary sm" data-tab="videos" role="tab">Video review</button>
      <button class="btn secondary sm" data-tab="accounts" role="tab">Flagged accounts</button>
      <button class="btn secondary sm" data-tab="campaigns" role="tab">Campaigns</button>
      <button class="btn secondary sm" data-tab="config" role="tab">Config</button>
      <button class="btn secondary sm" data-tab="audit" role="tab">Audit log</button>
    </div>
    <div id="reauth" hidden></div>
  <script>
  function showReauth() {
    const el = document.getElementById('reauth');
    el.hidden = false;
    el.innerHTML = '<div class="banner warn"><strong>Session too old for payout decisions.</strong> ' +
      'For safety, sign in again, then retry. <button class="btn primary sm" id="reauth-go">Sign in again</button></div>';
    document.getElementById('reauth-go').addEventListener('click', async () => {
      await KW.api('POST', '/v1/auth/logout', {});
      location.href = '/app/signup.html?admin=1';
    });
  }
  </script>
    <div id="panel"></div>
  </div>
</div>
<script src="/js/kw.js"></script>
<script>
(async function () {
  KW.topbar('Admin', { home: '/' });
  KW.offlineBar();
  const $ = (id) => document.getElementById(id);
  let me;
  try { me = await KW.api('GET', '/v1/me'); } catch (e) { location.href = '/app/signup.html'; return; }
  if (!me.user.roles.includes('admin')) {
    $('gate').innerHTML = '<div class="banner err">This area needs the admin role.</div>';
    return;
  }
  $('main').hidden = false;

  const tabs = document.querySelectorAll('[data-tab]');
  tabs.forEach((b) => b.addEventListener('click', () => show(b.dataset.tab)));
  function show(name) {
    tabs.forEach((b) => b.classList.toggle('primary', b.dataset.tab === name));
    ({ payouts: showPayouts, videos: showVideos, accounts: showAccounts, campaigns: showCampaigns, config: showConfig, audit: showAudit })[name]();
  }

  function sheet(title, bodyHtml, confirmLabel, onConfirm, danger) {
    const scrim = document.createElement('div');
    scrim.className = 'sheet-scrim';
    scrim.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${KW.esc(title)}">
        <div class="grab"></div><h3>${KW.esc(title)}</h3>${bodyHtml}
        <label for="sheet-note">Reason (the watcher will see this)</label>
        <input id="sheet-note" type="text" maxlength="500">
        <button class="btn ${danger ? 'danger' : 'primary'}" id="sheet-ok">${KW.esc(confirmLabel)}</button>
        <button class="btn ghost" id="sheet-cancel" style="width:100%;margin-top:8px">Cancel</button>
      </div>`;
    document.body.appendChild(scrim);
    scrim.querySelector('#sheet-cancel').addEventListener('click', () => scrim.remove());
    scrim.querySelector('#sheet-ok').addEventListener('click', async (e) => {
      const note = scrim.querySelector('#sheet-note').value.trim();
      KW.setBusy(e.currentTarget, true, 'Working…');
      try { await onConfirm(note); scrim.remove(); } catch (err) { KW.showError(err.message, err.requestId); }
      KW.setBusy(e.currentTarget, false);
    });
  }

  async function showPayouts() {
    const data = await KW.api('GET', '/v1/admin/payouts/queue');
    $('panel').innerHTML = data.payouts.length ? `
      <table class="data responsive"><thead><tr>
        <th>Amount</th><th>Method</th><th>To</th><th>Account</th><th>Requested</th><th></th>
      </tr></thead><tbody>
      ${data.payouts.map((p) => `<tr>
        <td data-th="Amount"><strong class="money">${KW.money(p.amount_cents)}</strong><br><span class="tiny">fee ${KW.money(p.fee_cents)}</span></td>
        <td data-th="Method">${KW.esc(p.method)}</td>
        <td data-th="To" class="mono">${KW.esc(p.destination.label || '')}</td>
        <td data-th="Account" class="small">Account ${p.account_age_days} days old · ${p.completions} completions · ${p.high_signals} high signals</td>
        <td data-th="Requested" class="small">${new Date(p.created_at * 1000).toLocaleString()}</td>
        <td data-th=""><div class="row">
          <button class="btn primary sm" data-approve="${p.id}" data-amt="${p.amount_cents}">Approve ${KW.money(p.amount_cents)}</button>
          <button class="btn ghost sm" data-reject="${p.id}" data-amt="${p.amount_cents}">Reject…</button>
        </div></td>
      </tr>`).join('')}</tbody></table>`
      : '<p class="small">Payout queue is empty.</p>';
    $('panel').querySelectorAll('[data-approve]').forEach((b) => b.addEventListener('click', async () => {
      try {
        await KW.api('POST', `/v1/admin/payouts/${b.dataset.approve}/decision`, { approve: true });
        KW.toast('Approved — the mock adapter will send it on the next run.');
        showPayouts();
      } catch (e) {
        if (e.code === 'reauth_required') return showReauth();
        KW.showError(e.message, e.requestId);
      }
    }));
    $('panel').querySelectorAll('[data-reject]').forEach((b) => b.addEventListener('click', () => {
      sheet('Reject payout',
        `<p>Reject payout — ${KW.money(Number(b.dataset.amt))} returns to the watcher.</p>`,
        `Reject payout — ${KW.money(Number(b.dataset.amt))} returns to the watcher`,
        async (note) => {
          if (!note) throw new Error('Give a reason — the watcher will see it.');
          try {
            await KW.api('POST', `/v1/admin/payouts/${b.dataset.reject}/decision`, { approve: false, note });
            showPayouts();
          } catch (e) {
            if (e.code === 'reauth_required') return showReauth();
            throw e;
          }
        }, true);
    }));
  }

  async function showVideos() {
    const data = await KW.api('GET', '/v1/admin/videos/review-queue');
    $('panel').innerHTML = data.videos.length ? data.videos.map((v) => `
      <div class="card"><div class="between">
        <div><strong class="mono">${v.id.slice(0, 8)}…</strong>
          <p class="small" style="margin:0">${KW.esc(v.advertiser || '')} · ${v.duration_s}s · ${(v.size_bytes / 1048576).toFixed(1)} MB · ${v.advertiser_video_count} videos</p></div>
        <span class="chip warn">IN REVIEW</span></div>
        <div class="row" style="margin-top:12px">
          <button class="btn primary sm" data-vapprove="${v.id}">Approve</button>
          <button class="btn ghost sm" data-vreject="${v.id}">Reject…</button>
        </div></div>`).join('')
      : '<p class="small">Review queue is empty.</p>';
    $('panel').querySelectorAll('[data-vapprove]').forEach((b) => b.addEventListener('click', async () => {
      await KW.api('POST', `/v1/admin/videos/${b.dataset.vapprove}/review`, { approve: true });
      KW.toast('Video approved.'); showVideos();
    }));
    $('panel').querySelectorAll('[data-vreject]').forEach((b) => b.addEventListener('click', () => {
      sheet('Reject video', '<p>Reason (the advertiser will see this)</p>', 'Reject video', async (note) => {
        if (!note) throw new Error('Give a reason — the advertiser will see it.');
        await KW.api('POST', `/v1/admin/videos/${b.dataset.vreject}/review`, { approve: false, reason: note });
        showVideos();
      }, true);
    }));
  }

  async function showAccounts() {
    const data = await KW.api('GET', '/v1/admin/accounts/flagged');
    $('panel').innerHTML = data.accounts.length ? `
      <table class="data responsive"><thead><tr>
        <th>Account</th><th>Status</th><th>Signals</th><th>Open flag</th><th></th>
      </tr></thead><tbody>
      ${data.accounts.map((a) => `<tr>
        <td data-th="Account"><strong>${KW.esc(a.display_name)}</strong><br><span class="mono tiny">${KW.esc(a.phone_masked)}</span><br><span class="tiny">${KW.esc(a.country_code)}</span></td>
        <td data-th="Status"><span class="chip ${a.status === 'active' ? 'ok' : a.status === 'banned' ? 'bad' : 'warn'}">${KW.esc(a.status.toUpperCase())}</span></td>
        <td data-th="Signals">${a.signal_count} total · ${a.high_signals} high</td>
        <td data-th="Open flag">${a.open_flag ? KW.esc(a.open_flag) : '—'}</td>
        <td data-th=""><div class="row">
          <button class="btn ghost sm" data-sig="${a.id}">Signals</button>
          <button class="btn secondary sm" data-warn="${a.id}">Warn</button>
          <button class="btn secondary sm" data-susp="${a.id}">Suspend</button>
          <button class="btn danger sm" data-ban="${a.id}">Ban</button>
          ${a.open_flag ? `<button class="btn ghost sm" data-clear="${a.id}">Clear</button>` : ''}
        </div></td>
      </tr>`).join('')}</tbody></table>`
      : '<p class="small">No flagged accounts.</p>';
    const flag = (id, action, label, danger) => sheet(label,
      `<p>${KW.esc(label)} — ${action === 'warn' ? 'the user sees a warning.' : action === 'suspend' ? 'blocks watching and payouts immediately.' : 'permanent. Use for fraud.'}</p>`,
      label, async (note) => {
        if (!note) throw new Error('Give a reason.');
        await KW.api('POST', `/v1/admin/accounts/${id}/flag`, { action, reason: note });
        showAccounts();
      }, danger);
    $('panel').querySelectorAll('[data-warn]').forEach((b) => b.addEventListener('click', () => flag(b.dataset.warn, 'warn', 'Warn account', false)));
    $('panel').querySelectorAll('[data-susp]').forEach((b) => b.addEventListener('click', () => flag(b.dataset.susp, 'suspend', 'Suspend account', true)));
    $('panel').querySelectorAll('[data-ban]').forEach((b) => b.addEventListener('click', () => flag(b.dataset.ban, 'ban', 'Ban account', true)));
    $('panel').querySelectorAll('[data-clear]').forEach((b) => b.addEventListener('click', async () => {
      await KW.api('POST', `/v1/admin/accounts/${b.dataset.clear}/clear`, {});
      KW.toast('Account cleared.'); showAccounts();
    }));
    $('panel').querySelectorAll('[data-sig]').forEach((b) => b.addEventListener('click', async () => {
      const s = await KW.api('GET', `/v1/admin/accounts/${b.dataset.sig}/signals`);
      const scrim = document.createElement('div');
      scrim.className = 'sheet-scrim';
      scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Fraud signals">
        <div class="grab"></div><h3>Fraud signals</h3>
        ${s.signals.map((x) => `<p><span class="chip ${x.severity === 'high' ? 'bad' : x.severity === 'medium' ? 'warn' : ''}">${KW.esc(x.severity)}</span>
          <span class="mono">${KW.esc(x.signal_type)}</span><br><span class="tiny">${new Date(x.created_at * 1000).toLocaleString()}</span></p>`).join('') || '<p class="small">None.</p>'}
        <button class="btn secondary" id="x" style="width:100%">Close</button></div>`;
      document.body.appendChild(scrim);
      scrim.querySelector('#x').addEventListener('click', () => scrim.remove());
    }));
  }

  async function showCampaigns() {
    const data = await KW.api('GET', '/v1/admin/campaigns');
    $('panel').innerHTML = `
      <table class="data responsive"><thead><tr>
        <th>Campaign</th><th>Advertiser</th><th>Status</th><th>Views</th><th>Completion</th><th>Spend</th>
      </tr></thead><tbody>
      ${data.campaigns.map((c) => {
        const cr = c.views ? Math.round((c.completions / c.views) * 100) : 0;
        const flag = cr > 90 && c.views >= 10;
        return `<tr>
        <td data-th="Campaign"><strong>${KW.esc(c.title)}</strong><br><span class="tiny mono">${c.id.slice(0, 8)}…</span></td>
        <td data-th="Advertiser">${KW.esc(c.advertiser || '')}</td>
        <td data-th="Status"><span class="chip ${c.status === 'live' ? 'ok' : ''}">${KW.esc(c.status.toUpperCase())}</span></td>
        <td data-th="Views">${c.views}</td>
        <td data-th="Completion">${cr}% ${flag ? '<span class="chip warn">ABNORMAL</span>' : ''}</td>
        <td data-th="Spend" class="money">${KW.money(c.spent_cents)} / ${KW.money(c.budget_cents)}</td>
      </tr>`; }).join('')}</tbody></table>`;
  }

  async function showConfig() {
    const data = await KW.api('GET', '/v1/admin/config');
    const entries = Object.entries(data.config).sort(([a], [b]) => a.localeCompare(b));
    $('panel').innerHTML = `
      <p class="small">Changes apply immediately — no redeploy.</p>
      <table class="data responsive"><thead><tr><th>Key</th><th>Value</th><th></th></tr></thead><tbody>
      ${entries.map(([k, v]) => `<tr>
        <td data-th="Key" class="mono">${KW.esc(k)}</td>
        <td data-th="Value"><input type="text" value="${KW.esc(v)}" data-k="${KW.esc(k)}" style="margin:0;min-height:44px"></td>
        <td data-th=""><button class="btn secondary sm" data-set="${KW.esc(k)}">Set</button></td>
      </tr>`).join('')}</tbody></table>`;
    $('panel').querySelectorAll('[data-set]').forEach((b) => b.addEventListener('click', async () => {
      const inp = $('panel').querySelector(`[data-k="${b.dataset.set}"]`);
      await KW.api('PUT', '/v1/admin/config', { key: b.dataset.set, value: inp.value });
      KW.toast('Config updated.');
    }));
  }

  async function showAudit() {
    const data = await KW.api('GET', '/v1/admin/audit-log?limit=50');
    $('panel').innerHTML = `
      <p class="small">Every admin action is recorded here, permanently.</p>
      ${data.entries.map((e) => `
        <div class="card"><div class="between">
          <strong class="mono">${KW.esc(e.action)}</strong>
          <span class="tiny">${new Date(e.created_at * 1000).toLocaleString()}</span></div>
          <p class="small">by ${KW.esc(e.admin_name || e.admin_id)} · ${KW.esc(e.target_type || '')} ${KW.esc((e.target_id || '').slice(0, 8))}</p>
          <pre class="tiny mono" style="white-space:pre-wrap">${KW.esc(JSON.stringify(e.diff, null, 1))}</pre>
        </div>`).join('') || '<p class="small">No audit entries yet.</p>'}`;
  }

  show('payouts');
})();
</script>
</body>
</html>
