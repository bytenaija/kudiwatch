<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earnings — KudiWatch</title>
<link rel="stylesheet" href="/css/kw.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b6e4f">
</head>
<body>
<div class="wrap" id="app">
  <h1>Earnings</h1>
  <div class="card" id="hero"><p class="small">Loading…</p></div>
  <div class="row" style="margin:16px 0">
    <a class="btn primary" href="/app/payout.html" style="flex:1">Request payout</a>
  </div>
  <p class="tiny">Minimum $1.00</p>
  <h2>Earnings history</h2>
  <div id="history"></div>
</div>
<script src="/js/kw.js"></script>
<script>
(async function () {
  KW.topbar('Earnings');
  KW.tabbar('earnings');
  KW.mockBanner();
  KW.offlineBar();
  try { await KW.requireAuth(); } catch (e) { return; }

  try {
    const w = await KW.api('GET', '/v1/wallet');
    document.getElementById('hero').innerHTML = `
      <p class="small" style="margin:0">Available balance</p>
      <div class="money" style="font-size:28px" aria-label="${KW.moneyA11y(w.balance_cents)}">${KW.money(w.balance_cents)}</div>
      ${w.pending_payout_cents ? `<p class="small">${KW.money(w.pending_payout_cents)} waiting in payout review</p>` : ''}
      <div class="between" style="margin-top:12px">
        <span class="small"><strong>${w.views_completed}</strong> videos watched</span>
        <span class="small"><strong>${KW.money(w.lifetime_earned_cents)}</strong> earned all time</span>
        ${w.avg_attention_pct != null ? `<span class="small"><strong>${w.avg_attention_pct}%</strong> attention</span>` : ''}
      </div>`;
  } catch (e) { KW.showError(e.message, e.requestId); }

  try {
    const data = await KW.api('GET', '/v1/wallet/ledger?limit=50');
    const earns = data.entries.filter((e) => e.entry_type === 'EARN_CREDIT' && e.side === 'credit');
    const hist = document.getElementById('history');
    if (!earns.length) {
      hist.innerHTML = `<div class="empty">
        <h3>No earnings yet.</h3>
        <p>Watch a video all the way through to earn your first cents.</p>
        <a class="btn secondary" href="/app/">Find videos</a></div>`;
      return;
    }
    // Enrich with receipts (session ids) — best-effort.
    hist.innerHTML = earns.map((e) => `
      <details class="receipt">
        <summary>
          <span style="flex:1"><strong>${KW.esc(e.memo || 'Video view')}</strong><br>
          <span class="tiny">${new Date(e.created_at * 1000).toLocaleString()}</span></span>
          <span class="money">+${KW.money(e.amount_cents)}</span>
        </summary>
        <div class="detail" data-receipt="${KW.esc(e.ref_id || '')}"><p class="small">Loading receipt…</p></div>
      </details>`).join('');
    hist.querySelectorAll('[data-receipt]').forEach(async (el) => {
      const sid = el.dataset.receipt;
      if (!sid) { el.innerHTML = '<p class="small">No receipt.</p>'; return; }
      try {
        const r = await KW.api('GET', `/v1/watch/${sid}/receipt`);
        const rc = r.receipt;
        el.innerHTML = `
          <dl>
            <dt>Session</dt><dd class="mono">${KW.esc(rc.session_id)}</dd>
            <dt>Campaign</dt><dd>${KW.esc(rc.campaign?.title || '')} (${KW.esc(rc.campaign?.advertiser || '')})</dd>
            <dt>Finished</dt><dd>${rc.completed_at ? new Date(rc.completed_at * 1000).toLocaleString() : '—'}</dd>
            <dt>Country</dt><dd>${KW.esc(rc.country || '—')}</dd>
            <dt>Attention checks</dt><dd>${rc.checks_passed}/${rc.checks_total} passed</dd>
          </dl>
          <p><span class="chip ok">Watch ${rc.watched_pct}%</span>
             <span class="chip ok">Attention ${rc.attention_score}%</span></p>`;
      } catch { el.innerHTML = '<p class="small">Receipt unavailable.</p>'; }
    });
  } catch (e) { KW.showError(e.message, e.requestId); }
})();
</script>
</body>
</html>
