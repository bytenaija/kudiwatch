<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payout — KudiWatch</title>
<link rel="stylesheet" href="/css/kw.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b6e4f">
</head>
<body>
<div class="wrap" id="app">
  <h1>Get your money</h1>
  <div id="mockslot"></div>

  <div class="card">
    <label for="amount">How much? (minimum $1.00)</label>
    <input id="amount" type="text" inputmode="decimal" placeholder="1.00">
    <p class="hint" id="amount-hint"></p>
    <p class="small" id="balance-line"></p>
  </div>

  <h2>How should we send it?</h2>
  <div id="methods"></div>
  <p class="tiny">Fees are estimates for this demo. Real fees will be shown before you confirm.</p>

  <div class="card" id="dest-card" hidden>
    <div id="dest-fields"></div>
  </div>

  <div class="card">
    <div class="between"><span>You'll receive</span><strong class="money" id="receive" style="font-size:20px">$0.00</strong></div>
    <p class="small" id="fx-line" hidden></p>
  </div>

  <button class="btn primary" id="request">Request payout</button>
  <div id="err"></div>

  <h2>Track payouts</h2>
  <div id="track"></div>
  <h2>Past payouts</h2>
  <div id="history"></div>
</div>
<script src="/js/kw.js"></script>
<script>
(async function () {
  KW.topbar('Payout');
  KW.tabbar('payout');
  KW.mockBanner();
  KW.offlineBar();
  let me;
  try { me = await KW.requireAuth(); } catch (e) { return; }

  const METHODS = [
    { id: 'mpesa', name: 'M-Pesa', icon: '📱', fee: 'Fee 1.5% · Arrives in ~5 minutes',
      fields: [{ k: 'msisdn', label: 'M-Pesa phone number', hint: 'e.g. +254712345678' }] },
    { id: 'airtime', name: 'Airtime', icon: '⚡', fee: 'No fee · Arrives in ~5 minutes',
      fields: [{ k: 'msisdn', label: 'Phone number for airtime', hint: 'e.g. +2348012345678' }] },
    { id: 'bank', name: 'Bank transfer', icon: '🏦', fee: 'Fee $0.30 · Arrives in ~1 day',
      fields: [{ k: 'bank', label: 'Bank', hint: 'e.g. GTBank' }, { k: 'account_number', label: 'Account number', hint: '10 digits' }] },
    { id: 'usdt', name: 'USDT', icon: '🔗', fee: 'Network fee $1.00 · Arrives in ~10 minutes',
      fields: [{ k: 'address', label: 'USDT wallet address', hint: '0x… / T… / …' },
               { k: 'network', label: 'Network', hint: 'ERC20, TRC20, BEP20 or Polygon' }] },
  ];
  let method = 'mpesa';
  let balance = me.wallet.balance_cents;
  const MIN = 100;

  document.getElementById('balance-line').textContent = `Available: ${KW.money(balance)}`;
  document.getElementById('methods').innerHTML = METHODS.map((m) => `
    <button class="method-card ${m.id === method ? 'sel' : ''}" data-m="${m.id}" aria-pressed="${m.id === method}">
      <span class="ic" aria-hidden="true">${m.icon}</span>
      <span><strong>${m.name}</strong><br><span class="meta">${m.fee}</span></span>
    </button>`).join('');
  document.querySelectorAll('.method-card').forEach((b) => b.addEventListener('click', () => {
    method = b.dataset.m;
    document.querySelectorAll('.method-card').forEach((x) => {
      x.classList.toggle('sel', x === b);
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
    renderDest(); updateReceive();
  }));

  function renderDest() {
    const m = METHODS.find((x) => x.id === method);
    const card = document.getElementById('dest-card');
    card.hidden = false;
    document.getElementById('dest-fields').innerHTML = m.fields.map((f) => `
      <label for="dest-${f.k}">${KW.esc(f.label)}</label>
      <input id="dest-${f.k}" type="text" placeholder="${KW.esc(f.hint)}" data-k="${f.k}">`).join('');
  }

  function amountCents() {
    const v = Number(String(document.getElementById('amount').value).replace(/[^0-9.]/g, ''));
    return Number.isFinite(v) ? Math.round(v * 100) : 0;
  }
  function feeFor(cents) {
    if (method === 'mpesa') return Math.max(1, Math.round(cents * 0.015));
    if (method === 'bank') return 30;
    if (method === 'usdt') return 100;
    return 0;
  }
  function updateReceive() {
    const c = amountCents();
    const hint = document.getElementById('amount-hint');
    if (c > 0 && c < MIN) hint.textContent = `Minimum payout is $1.00. You're at ${KW.money(c)} — ${KW.money(MIN - c)} to go.`;
    else if (c > balance) hint.textContent = `That's more than your ${KW.money(balance)} balance.`;
    else hint.textContent = '';
    const net = Math.max(0, c - feeFor(c));
    document.getElementById('receive').textContent = KW.money(net);
  }
  document.getElementById('amount').addEventListener('input', updateReceive);
  renderDest(); updateReceive();

  document.getElementById('request').addEventListener('click', async () => {
    const c = amountCents();
    if (c < MIN) { KW.toast(`Minimum payout is $1.00.`, 'warn'); return; }
    if (c > balance) { KW.toast(`That's more than your ${KW.money(balance)} balance.`, 'warn'); return; }
    const dest = {};
    document.querySelectorAll('#dest-fields input').forEach((i) => { dest[i.dataset.k] = i.value.trim(); });
    if (Object.values(dest).some((v) => !v)) { KW.toast('Fill in the destination details.', 'warn'); return; }

    // Confirm sheet with the money consequence stated.
    const fee = feeFor(c);
    const scrim = document.createElement('div');
    scrim.className = 'sheet-scrim';
    scrim.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Confirm payout">
        <div class="grab"></div>
        <h3>Confirm payout</h3>
        <div class="between"><span>Amount</span><strong class="money">${KW.money(c)}</strong></div>
        <div class="between"><span>Fee</span><span>${KW.money(fee)}</span></div>
        <div class="between"><span>You'll receive</span><strong class="money">${KW.money(c - fee)}</strong></div>
        <div class="between"><span>To</span><span class="small">${KW.esc(Object.values(dest).join(' · '))}</span></div>
        <p class="small">A person reviews every payout before money moves. This usually takes under 24 hours.</p>
        <button class="btn primary" id="confirm">Confirm payout</button>
        <button class="btn ghost" id="cancel" style="width:100%;margin-top:8px">Cancel</button>
      </div>`;
    document.body.appendChild(scrim);
    scrim.querySelector('#cancel').addEventListener('click', () => scrim.remove());
    scrim.querySelector('#confirm').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      KW.setBusy(btn, true, 'Requesting…');
      try {
        const data = await KW.api('POST', '/v1/payouts', {
          method, destination: dest, amount_cents: c,
          idempotency_key: crypto.randomUUID(),
        });
        scrim.remove();
        localStorage.setItem('kw_payout_dot', '1');
        KW.toast('Payout requested. It\u2019s under review now.');
        balance -= c;
        document.getElementById('balance-line').textContent = `Available: ${KW.money(balance)}`;
        loadTrack();
      } catch (err) { KW.showError(err.message, err.requestId); }
      KW.setBusy(btn, false);
    });
  });

  const STEP_LABELS = [
    ['pending_review', 'Under review', 'A reviewer checks every payout. This usually takes under 24 hours.'],
    ['approved', 'Approved', 'Approved — waiting to be sent.'],
    ['processing', 'Sending', 'Sending it now.'],
    ['completed', 'Paid', 'Done.'],
  ];

  async function loadTrack() {
    try {
      const data = await KW.api('GET', '/v1/payouts');
      const items = data.payouts || [];
      localStorage.removeItem('kw_payout_dot');
      const track = document.getElementById('track');
      const hist = document.getElementById('history');
      const activeP = items.find((p) => !['completed', 'rejected', 'refunded', 'failed'].includes(p.status));
      if (activeP) {
        const idx = { pending_review: 0, approved: 1, processing: 2, completed: 3 }[activeP.status] ?? 0;
        track.innerHTML = `
          <div class="card">
            <div class="between"><strong>${KW.money(activeP.amount_cents)} via ${KW.esc(activeP.method)}</strong>
              <span class="chip ${activeP.status === 'pending_review' ? 'warn' : 'info'}">${KW.esc(activeP.status.replace('_', ' '))}</span></div>
            <ol class="stepper">
              ${STEP_LABELS.map(([s, label, sub], i) => `
                <li class="${i < idx ? 'done' : i === idx ? 'now' : ''}">
                  <span class="n">${i < idx ? '✓' : i + 1}</span>
                  <span><span class="t">${label}</span><br><span class="s">${i === idx ? sub : ''}</span></span>
                </li>`).join('')}
            </ol>
            <p class="tiny mono">state: ${KW.esc(activeP.status)} · id ${KW.esc(activeP.id.slice(0, 8))}…</p>
          </div>`;
      } else {
        track.innerHTML = '<p class="small">No payout in flight.</p>';
      }
      const past = items.filter((p) => ['completed', 'rejected', 'refunded', 'failed'].includes(p.status));
      hist.innerHTML = past.length ? past.map((p) => `
        <div class="card">
          <div class="between"><strong>${KW.money(p.amount_cents)}</strong>
            <span class="chip ${p.status === 'completed' ? 'ok' : p.status === 'refunded' ? '' : 'bad'}">${KW.esc(p.status.toUpperCase())}</span></div>
          <p class="small">${p.status === 'completed' ? 'Paid.' : p.status === 'refunded' ? `Returned to your balance.` : `Not sent.`}
            ${p.decision_note ? ` — ${KW.esc(p.decision_note)}` : ''}</p>
          <p class="tiny">${new Date(p.created_at * 1000).toLocaleString()}</p>
        </div>`).join('')
        : '<p class="small">No payouts yet. When you request a payout it will be tracked here, step by step.</p>';
    } catch (e) { /* ignore */ }
  }
  loadTrack();
})();
</script>
</body>
</html>
