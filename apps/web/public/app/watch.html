<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch — KudiWatch</title>
<link rel="stylesheet" href="/css/kw.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<style>
  .stage { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
  .stage video { width: 100%; height: 100%; display: block; }
  .stage .overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.78); color: #fff; text-align: center; padding: 24px; z-index: 5;
  }
  .transport { display: flex; align-items: center; gap: 8px; padding: 8px 4px; }
  .tbtn {
    min-width: 48px; min-height: 48px; border: none; background: var(--surface); color: var(--ink);
    border-radius: 10px; font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .lockbadge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; color: var(--ink-2);
  }
  .segbar { position: relative; height: 12px; background: var(--surface); border-radius: 999px; border: 1px solid var(--line); margin: 4px 0; }
  .segbar .ph { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--ink); border-radius: 2px; transform: translateX(-50%); }
  .segbar .touch { position: absolute; left: 0; right: 0; top: -12px; bottom: -12px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div id="meta"></div>
  <div class="stage" id="stage">
    <video id="v" playsinline preload="metadata" aria-label="Advertisement video"></video>
    <div class="overlay" id="hidden-overlay" role="alert">
      <div>
        <div style="font-size:40px" aria-hidden="true">⏸</div>
        <h3 style="color:#fff">Paused — this tab is hidden</h3>
        <p style="color:#ddd">Watching doesn't count while the tab is hidden. Come back to keep earning.</p>
        <button class="btn primary" id="resume" style="max-width:280px;margin:0 auto">Resume watching</button>
      </div>
    </div>
    <div class="overlay" id="done-overlay">
      <div id="done-card" style="width:100%"></div>
    </div>
    <div class="overlay" id="fail-overlay">
      <div>
        <h3 style="color:#fff">This watch didn't count.</h3>
        <p style="color:#ddd" id="fail-msg"></p>
        <a class="btn primary" href="/app/" style="max-width:280px;margin:0 auto">Back to videos</a>
      </div>
    </div>
  </div>

  <div class="transport">
    <button class="tbtn" id="playpause" aria-label="Play">▶</button>
    <span class="small" id="time" style="font-variant-numeric:tabular-nums">0:00 / 0:00</span>
    <span class="spacer" style="flex:1"></span>
    <span class="lockbadge" title="Faster playback doesn't count. Everyone watches at normal speed.">🔒 1× — speed locked</span>
    <button class="tbtn" id="fs" aria-label="Fullscreen">⛶</button>
  </div>
  <div class="segbar" id="segbar" role="progressbar" aria-label="Verified watched progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="ph" id="playhead"></div>
    <div class="touch"></div>
  </div>

  <ul class="checklist" id="checklist" aria-live="polite"></ul>

  <div class="between" style="margin-top:8px">
    <button class="btn ghost" id="skip">Skip video</button>
    <span class="tiny mono" id="dbg"></span>
  </div>
</div>
<script src="/js/kw.js"></script>
<script src="/js/player.js"></script>
<script>
(async function () {
  KW.topbar('Watch');
  KW.mockBanner();
  KW.offlineBar();
  try { await KW.requireAuth(); } catch (e) { return; }

  const sid = new URLSearchParams(location.search).get('sid');
  const claimRaw = sessionStorage.getItem('kw_claim');
  if (!sid || !claimRaw) { location.href = '/app/'; return; }
  const claim = JSON.parse(claimRaw);

  // Title block from the claim (no extra fetch needed).
  const cp = claim.campaign || {};
  document.getElementById('meta').innerHTML = `
    <h2 style="margin-bottom:4px">${KW.esc(cp.title || 'Video')}</h2>
    <p class="small" style="margin:0">Paid ad · Earn ${KW.money(cp.price_per_view_cents || 0)} when you finish</p>`;

  const video = document.getElementById('v');
  const streamUrl = `${claim.stream_url}?wt=${encodeURIComponent(claim.watch_token)}`;

  // Probe duration from metadata (authoritative duration came from the claim video).
  const player = new WatchPlayer({
    sessionId: sid,
    videoEl: video,
    streamUrl,
    checks: claim.checks || [],
    duration: (claim.video && claim.video.duration_s) || 60,
    barEls: {
      segBar: document.getElementById('segbar'),
      playhead: document.getElementById('playhead'),
      timeLabel: document.getElementById('time'),
      checklist: document.getElementById('checklist'),
      hiddenOverlay: document.getElementById('hidden-overlay'),
    },
    onDone: (data) => {
      const card = document.getElementById('done-card');
      card.innerHTML = `
        <div class="flash" style="border-radius:12px;padding:8px">
          <div class="money" style="font-size:28px;color:var(--gold)" aria-label="${KW.moneyA11y(data.credited_cents)} added">+${KW.money(data.credited_cents)}</div>
          <p style="color:#fff;margin:4px 0">added to your balance</p>
          <p class="small" style="color:#ddd">Attention score: ${data.receipt.attention_score}% · Watched: ${data.receipt.watched_pct}%</p>
          <div class="row" style="justify-content:center">
            <a class="btn secondary" href="/app/earnings.html">View receipt</a>
            <a class="btn primary" href="/app/" style="width:auto">Next video</a>
          </div>
        </div>`;
      document.getElementById('done-overlay').style.display = 'flex';
    },
    onFail: (reason, message) => {
      document.getElementById('fail-msg').textContent = message || 'This watch did not count.';
      document.getElementById('fail-overlay').style.display = 'flex';
    },
  });

  // Duration: wait for metadata, fall back to claim.
  await new Promise((resolve) => {
    video.addEventListener('loadedmetadata', resolve, { once: true });
    video.src = streamUrl;
    setTimeout(resolve, 5000);
  });
  player.duration = video.duration || 60;
  player.start();

  document.getElementById('playpause').addEventListener('click', (e) => {
    player.toggle();
    e.currentTarget.textContent = video.paused ? '▶' : '⏸';
    e.currentTarget.setAttribute('aria-label', video.paused ? 'Play' : 'Pause');
  });
  video.addEventListener('play', () => {
    const b = document.getElementById('playpause');
    b.textContent = '⏸'; b.setAttribute('aria-label', 'Pause');
  });
  video.addEventListener('pause', () => {
    const b = document.getElementById('playpause');
    b.textContent = '▶'; b.setAttribute('aria-label', 'Play');
  });
  document.getElementById('fs').addEventListener('click', () => {
    const st = document.getElementById('stage');
    document.fullscreenElement ? document.exitFullscreen() : st.requestFullscreen?.();
  });
  document.getElementById('resume').addEventListener('click', () => video.play().catch(() => {}));
  document.getElementById('skip').addEventListener('click', async () => {
    if (!confirm('Skip this video? Skipped videos can come back after 24 hours. You won\u2019t earn for this one.')) return;
    player.failed = true;
    clearInterval(player.hbTimer);
    location.href = '/app/';
  });
  document.getElementById('dbg').textContent = `sid ${sid.slice(0, 8)}…`;
})();
</script>
</body>
</html>
