# KudiWatch API — Cloudflare Worker (Hono)
name = "kudiwatch-api"
account_id = "afc92595c65e7247ad546cc945893d2f" # bytenaija (dev) account; token holds 2 accounts
main = "src/workers.ts"
compatibility_date = "2026-10-01"

[vars]
ENV_NAME = "prod"

# --- D1 (create for real deploys; local dev uses node:sqlite, no account needed)
# [[d1_databases]]
# binding = "DB"
# database_name = "kudiwatch"
# database_id = "<fill in>"
# migrations_dir = "../../db/migrations"

# --- R2 (create for real deploys; local dev uses ./data/r2 shim)
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "kw-videos"

# --- Staging (testing): kudiwatch-staging D1 + kw-videos-staging R2, web PWA served
# from the worker via Static Assets (same-origin /v1/* API). Deploy with:
#   wrangler --env staging deploy
[env.staging]
name = "kudiwatch-api-staging"

[env.staging.vars]
ENV_NAME = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "kudiwatch-staging"
database_id = "975b2014-d5ce-464e-976b-40643a55dcb2"
migrations_dir = "../../db/migrations"

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "kw-videos-staging"

[env.staging.assets]
directory = "../web/dist/client"
binding = "ASSETS"
run_worker_first = ["/v1/*"]
not_found_handling = "single-page-application"

[dev]
port = 8787

# Secrets (never commit; set via `wrangler secret put`):
#   JWT_SECRET, WATCH_TOKEN_SECRET, OTP_PEPPER
